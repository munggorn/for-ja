:root{
  --night:#141c5c;
  --cream:#fff6dc;
  --gold:#f2b33d;
  --plum:#3b1f8f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night)}
body{color:#fff;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{display:block;-webkit-user-drag:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* Blurred copy of the painting fills the screen around the card */
.backdrop{position:fixed;inset:-60px;background:center/cover no-repeat;filter:blur(22px) brightness(.8) saturate(1.15);transform:translateZ(0)}
.backdrop.b-open{opacity:0;transition:opacity .5s}
.is-open .backdrop.b-open{opacity:1}

/* The stage keeps the painting's own proportions (542 x 1219) */
.stage{position:absolute;left:50%;top:0;width:var(--sw,100vw);height:var(--sh,100vh);transform:translate3d(-50%,var(--sy,0px),0);overflow:hidden;box-shadow:0 0 28px 8px rgba(8,10,48,.55)}
.scene{position:absolute;inset:0}
.scene[hidden]{display:none}
#closed{opacity:0;transition:opacity .4s ease-out}
.ready #closed{opacity:1}
.base{position:absolute;inset:0;width:100%;height:100%}
.sp{position:absolute;width:var(--w);height:auto;left:var(--x);top:var(--y)}
.layer{position:absolute;inset:0;pointer-events:none}

/* Light rays turning slowly behind the box */
.rays{position:absolute;left:50%;top:var(--cy);width:150%;aspect-ratio:1;margin-left:-75%;margin-top:-75%;
  background:repeating-conic-gradient(from 0deg,rgba(255,247,214,0) 0deg,rgba(255,247,214,.3) 6deg,rgba(255,247,214,0) 13deg);
  -webkit-mask:radial-gradient(circle,#000 8%,rgba(0,0,0,.6) 22%,transparent 48%);mask:radial-gradient(circle,#000 8%,rgba(0,0,0,.6) 22%,transparent 48%);
  animation:spin 48s linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}

/* Balloons */
.bal{position:absolute;left:var(--x);top:var(--y);width:var(--w);will-change:transform}
.bal .sway{animation:sway var(--sd,4.2s) ease-in-out infinite alternate;transform-origin:var(--kx) 100%}
.bal img{width:100%;height:auto}
.bal svg{position:absolute;left:calc(var(--kx) - 10%);top:97%;width:20%;height:85%;overflow:visible}
.bal path{fill:none;stroke:rgba(255,214,226,.6);stroke-width:1.1;vector-effect:non-scaling-stroke}
@keyframes sway{from{transform:translateX(-7%) rotate(-4deg)}to{transform:translateX(7%) rotate(4deg)}}

/* Gift box */
.box{position:absolute;inset:0;transform-origin:50% 74.2%;animation:breathe 2.4s ease-in-out infinite;will-change:transform}
.box-in{position:absolute;inset:0;transform-origin:50% 74.2%;animation:nudge 4.5s ease-in-out 1.2s infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.986)}}
@keyframes nudge{0%,74%,100%{transform:none}78%{transform:translateY(-1.4%) rotate(-2.5deg)}83%{transform:translateY(-.4%) rotate(2.5deg)}88%{transform:rotate(-1.5deg)}93%{transform:rotate(.8deg)}}
.lid{transform-origin:50% 100%;will-change:transform}
.gap{position:absolute;left:20%;width:60%;top:58.6%;height:6%;border-radius:50%;
  background:radial-gradient(closest-side,#fffef6 0%,rgba(255,246,196,.95) 35%,rgba(255,214,110,.5) 65%,rgba(255,200,80,0) 100%);opacity:0}
.hit{position:absolute;left:12%;top:44%;width:76%;height:31%;cursor:pointer;pointer-events:auto}

/* Twinkles and drifting light dust */
.tw{position:absolute;left:var(--x);top:var(--y);width:var(--s,5%);aspect-ratio:1;margin:calc(var(--s,5%) / -2) 0 0 calc(var(--s,5%) / -2);
  clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);
  background:radial-gradient(circle,#fff 0 30%,#fff6c9 55%,rgba(255,240,180,0) 75%);
  transform:scale(0);animation:twinkle var(--d,2.8s) ease-in-out var(--t,0s) infinite}
@keyframes twinkle{0%,100%{transform:scale(0) rotate(0)}45%{transform:scale(1) rotate(45deg)}60%{transform:scale(.2) rotate(70deg)}}
.dust{position:absolute;left:24%;top:36%;width:52%;height:36%}
.dust i{position:absolute;bottom:0;left:var(--x);width:1.6%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#fff 0 30%,rgba(255,236,170,.8) 50%,rgba(255,220,140,0) 72%);
  opacity:0;animation:rise var(--d,5s) linear var(--t,0s) infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{opacity:.8}100%{transform:translateY(-2200%);opacity:0}}

/* Painted game buttons */
.pbtn{position:absolute;left:var(--x);top:var(--y);width:var(--w);padding:0;margin:0;border:0;background:none;cursor:pointer;
  border-radius:999px;animation:pulse 1.5s ease-in-out infinite;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.pbtn img{width:100%;height:auto;pointer-events:none}
.pbtn:active{animation:none;transform:scale(.94)}
.pbtn:focus-visible{outline:4px solid #fff;outline-offset:4px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}

/* Opened scene */
.glow{position:absolute;left:50%;top:var(--cy);width:80%;aspect-ratio:1.4;margin:-28.6% 0 0 -40%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,252,232,.75),rgba(255,236,170,.35) 45%,rgba(255,220,140,0) 100%);
  animation:glowp 2.2s ease-in-out infinite}
@keyframes glowp{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.lan{position:absolute;left:var(--x);top:64%;width:var(--w);will-change:transform,opacity;opacity:0}
.pax{position:absolute;left:50%;top:58.7%;transform:translateX(-50%);max-width:84%;
  padding:.28em 1.1em .34em;border-radius:999px;background:var(--cream);color:var(--plum);
  border:.16em solid var(--gold);box-shadow:0 .18em 0 #b8741a,0 .4em .9em rgba(40,10,80,.35);
  font:500 calc(var(--sh,800px) * .019)/1.15 "Mitr",system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.pax[hidden]{display:none}
.in-ticket,.in-ribbon,.in-burst{transform-origin:50% 50%}
.is-open .in-ticket{animation:land .75s cubic-bezier(.2,.8,.3,1) .05s both}
.is-open .in-ribbon{animation:land .7s cubic-bezier(.2,.8,.3,1) .2s both}
.is-open .in-burst{animation:land .6s cubic-bezier(.2,.8,.3,1) .45s both,pop 1.6s ease-in-out 1.2s infinite}
.is-open .pax{animation:paxin .5s cubic-bezier(.2,.8,.3,1.3) .7s both}
@keyframes land{0%{transform:scale(1.45);opacity:0}35%{opacity:1}70%{transform:scale(.995)}82%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes paxin{from{transform:translateX(-50%) scale(.3);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}

/* Sound on/off */
.snd{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);
  width:44px;height:44px;padding:0;margin:0;border-radius:50%;border:2px solid var(--gold);background:rgba(59,31,143,.82);color:var(--cream);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 #b8741a,0 6px 14px rgba(20,8,60,.4);
  -webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.snd svg{width:24px;height:24px;display:block}
.snd .off{display:none}
.snd[aria-pressed="false"] .on{display:none}
.snd[aria-pressed="false"] .off{display:inline}
html:not(.started) .snd{display:none}

/* First tap: starts the music (phones allow sound only after a touch), then OPEN GIFT appears */
.start{position:absolute;inset:0;z-index:4;width:100%;height:100%;padding:0;margin:0;border:0;background:transparent;cursor:pointer;
  -webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;color:var(--plum)}
.start span{position:absolute;left:50%;top:87.3%;width:77%;height:12.4%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:.45em;white-space:nowrap;
  padding:0 .8em;border-radius:999px;background:var(--cream);border:.16em solid var(--gold);
  box-shadow:0 .2em 0 #b8741a,0 .45em 1em rgba(40,10,80,.4);
  font:500 calc(var(--sh,800px) * .036)/1 "Mitr",system-ui,sans-serif;letter-spacing:.03em;
  transform:translate(-50%,-50%);animation:startp 1.4s ease-in-out infinite}
.start svg{width:1.05em;height:1.05em;flex:none}
.start:focus-visible span{outline:4px solid #fff;outline-offset:4px}
@keyframes startp{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.04)}}
html:not(.started) #openBtn{visibility:hidden}
.snd:active{transform:translateY(2px);box-shadow:0 1px 0 #b8741a,0 3px 8px rgba(20,8,60,.4)}
.snd:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* Wheel scene (painting 941 x 1672): only the coloured disc turns */
.backdrop.b-wheel{opacity:0;transition:opacity .5s}
.is-wheel .backdrop.b-wheel{opacity:1}
.wmap{position:absolute;left:var(--cx);top:var(--cy);width:var(--s);aspect-ratio:1;margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2)}
.rotor{position:absolute;inset:0;will-change:transform}
.rotor img{width:100%;height:100%}
.win{position:absolute;inset:0;opacity:0;mix-blend-mode:screen;
  background:conic-gradient(from 300.73deg,rgba(255,244,200,.75) 0deg 59.77deg,rgba(255,244,200,0) 59.77deg);
  -webkit-mask:radial-gradient(circle closest-side,transparent 34%,#000 37%,#000 95%,transparent 97%);mask:radial-gradient(circle closest-side,transparent 34%,#000 37%,#000 95%,transparent 97%)}
.won .win{animation:winp .9s ease-in-out infinite alternate}
@keyframes winp{from{opacity:.1}to{opacity:.5}}
.wptr{transform-origin:49.68% 16.60%;will-change:transform}
.whub{position:absolute;left:var(--x);top:var(--y);width:var(--w);padding:0;margin:0;border:0;background:none;border-radius:50%;cursor:pointer;
  -webkit-appearance:none;appearance:none;touch-action:manipulation;animation:pulse 1.6s ease-in-out infinite}
.whub img{width:100%;height:auto;pointer-events:none}
.whub:focus-visible{outline:4px solid #fff;outline-offset:4px}
.spinning .whub,.spinning #spinBtn,.won .whub,.won #spinBtn{animation:none;pointer-events:none}

/* Flash between the two scenes */
.flash{position:fixed;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 55%,#fff 0 30%,#fff4cf 60%,#ffe08a 100%)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fx i{position:absolute;left:0;top:0;width:9px;height:15px;border-radius:2px;will-change:transform,opacity}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .tw,.dust{display:none}
}
</style>
</head>
<body>
<div class="backdrop" style="background-image:url(img/base_closed_blur.webp)"></div>
<div class="backdrop b-wheel" style="background-image:url(img/w_blur.webp)"></div>
<div class="backdrop b-open" style="background-image:url(img/base_open_blur.webp)"></div>

<main class="stage" id="stage">
  <!-- Before: the gift -->
  <section class="scene" id="closed">
    <h1 class="sr" lang="en">Happy Birthday, Ja!</h1>
    <img class="base" src="img/base_closed.webp" alt="" fetchpriority="high">
    <div class="layer" style="--cy:52%"><div class="rays"></div></div>
    <div class="layer" id="balloons"></div>
    <div class="layer">
      <span class="tw" style="--x:16.1%;--y:25.4%;--s:9%;--t:.4s"></span>
      <span class="tw" style="--x:81.4%;--y:41.9%;--s:8%;--t:1.7s;--d:3.2s"></span>
      <span class="tw" style="--x:84.6%;--y:28.6%;--s:6%;--t:2.6s"></span>
      <span class="tw" style="--x:23%;--y:9%;--s:6%;--t:1.1s;--d:3.4s"></span>
    </div>
    <div class="layer dust" aria-hidden="true">
      <i style="--x:8%;--d:6s;--t:0s"></i><i style="--x:22%;--d:7s;--t:1.5s"></i><i style="--x:37%;--d:5.5s;--t:3s"></i>
      <i style="--x:52%;--d:6.5s;--t:.8s"></i><i style="--x:66%;--d:5.8s;--t:2.2s"></i><i style="--x:81%;--d:7.2s;--t:4s"></i>
      <i style="--x:93%;--d:6.2s;--t:1s"></i><i style="--x:45%;--d:7.5s;--t:4.6s"></i>
    </div>
    <div class="box" id="box">
      <div class="box-in" id="boxIn">
        <img class="sp body" src="img/body.webp" alt="" style="--x:12.977%;--y:60.541%;--w:71.341%">
        <div class="gap" id="gap"></div>
        <img class="sp lid" id="lid" src="img/lid.webp" alt="" style="--x:12.177%;--y:43.834%;--w:73.862%">
        <div class="hit" id="boxHit" aria-hidden="true"></div>
      </div>
    </div>
    <button class="pbtn" id="openBtn" type="button" lang="en" aria-label="Open gift" style="--x:13.100%;--y:81.542%;--w:74.354%">
      <img src="img/btn_open.webp" alt="">
    </button>
    <button class="start" id="startBtn" type="button" lang="en">
      <span><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M9 3.5l11-2.2v13.4a3.3 3.3 0 1 1-2-3V6.2l-7 1.4v9.6a3.3 3.3 0 1 1-2-3z"/></svg>TAP TO START</span>
    </button>
  </section>

  <!-- Middle: the prize wheel -->
  <section class="scene" id="wheel" hidden>
    <h2 class="sr" lang="en" tabindex="-1">Spin the wheel</h2>
    <div class="wmap" style="--cx:49.095%;--cy:53.172%;--s:91.714%;transform:rotate(15.251deg) scale(0.99100,1.00900) rotate(-15.251deg)">
      <div class="rotor" id="rotor"><img id="wDisc" src="img/w_disc.webp" alt="" decoding="async"><div class="win"></div></div>
    </div>
    <img class="base" id="wBase" src="img/w_base.webp" alt="" decoding="async">
    <div class="layer">
      <span class="tw" style="--x:12%;--y:31%;--s:5%;--t:.4s"></span>
      <span class="tw" style="--x:88%;--y:29%;--s:6%;--t:1.6s"></span>
      <span class="tw" style="--x:93%;--y:56%;--s:5%;--t:2.4s"></span>
      <span class="tw" style="--x:6%;--y:66%;--s:5%;--t:1.1s"></span>
    </div>
    <img class="sp wptr" id="wPtr" src="img/w_ptr.webp" alt="" style="--x:44.476%;--y:22.209%;--w:10.977%">
    <button class="whub" id="hubBtn" type="button" lang="en" aria-label="Spin" style="--x:33.924%;--y:44.258%;--w:30.524%">
      <img src="img/w_hub.webp" alt="">
    </button>
    <button class="pbtn" id="spinBtn" type="button" lang="en" aria-label="Spin now" style="--x:19.901%;--y:88.198%;--w:56.657%">
      <img src="img/w_btn.webp" alt="">
    </button>
  </section>

  <!-- After: the surprise -->
  <section class="scene" id="opened" hidden>
    <h2 class="sr" lang="en" tabindex="-1">Surprise! A trip to Chiang Mai, 3 days 2 nights</h2>
    <img class="base" id="openBase" src="img/base_open.webp" alt="" loading="eager" decoding="async">
    <div class="layer" style="--cy:62%"><div class="rays"></div></div>
    <div class="layer" style="--cy:62.5%"><div class="glow"></div></div>
    <div class="layer" id="lanterns"></div>
    <div class="layer">
      <img class="sp in-burst" src="img/burst.webp" alt="" style="--x:35.916%;--y:8.805%;--w:28.044%">
      <img class="sp in-ribbon" src="img/ribbon.webp" alt="" style="--x:1.784%;--y:14.137%;--w:96.617%">
      <img class="sp in-ticket" src="img/ticket.webp" alt="" style="--x:7.073%;--y:42.302%;--w:86.162%">
      <span class="tw" style="--x:95.5%;--y:48%;--s:7%;--t:.3s"></span>
      <span class="tw" style="--x:78.4%;--y:58.8%;--s:6%;--t:1.4s"></span>
      <span class="tw" style="--x:25%;--y:60%;--s:6%;--t:2.1s"></span>
      <span class="tw" style="--x:90.5%;--y:57.8%;--s:5%;--t:.9s;--d:3.4s"></span>
      <span class="tw" style="--x:62%;--y:24%;--s:5%;--t:2.6s"></span>
    </div>
    <p class="pax" id="pax" hidden></p>
    <button class="pbtn" id="goBtn" type="button" lang="en" aria-label="Let's go!" style="--x:13.100%;--y:81.542%;--w:74.354%">
      <img src="img/btn_go.webp" alt="">
    </button>
  </section>
</main>
<div class="flash" id="flash"></div>
<div id="fx" aria-hidden="true"></div>
<button class="snd" id="sndBtn" type="button" lang="en" aria-label="Sound" aria-pressed="true">
  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
    <path class="on" d="M15.5 9a4.2 4.2 0 0 1 0 6M18.2 6.5a8 8 0 0 1 0 11"/>
    <path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/>
  </svg>
</button>

<script>
(function () {
  var root = document.documentElement;
  var stage = document.getElementById('stage');
  var closed = document.getElementById('closed');
  var opened = document.getElementById('opened');
  var openBtn = document.getElementById('openBtn');
  var goBtn = document.getElementById('goBtn');
  var lid = document.getElementById('lid');
  var gap = document.getElementById('gap');
  var boxIn = document.getElementById('boxIn');
  var flash = document.getElementById('flash');
  var fx = document.getElementById('fx');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canAnim = !!document.body.animate;

  // Passenger name comes from the link (#First-Last), never from this file.
  try {
    var raw = decodeURIComponent(location.hash.slice(1)).replace(/-/g, ' ').replace(/\s+/g, ' ').trim();
    if (raw && raw.length <= 40 && new RegExp('^[\\p{L}\\p{M} ]+$', 'u').test(raw)) {
      var pax = document.getElementById('pax');
      pax.textContent = raw;
      pax.hidden = false;
    }
  } catch (e) {}

  // Fit the painting: title to button always visible, more sky on taller screens.
  var FITS = { gift: [542 / 1219, 0.125, 0.94], wheel: [941 / 1672, 0.006, 0.99] };
  var RATIO = FITS.gift[0], TOP = FITS.gift[1], BOTTOM = FITS.gift[2];
  function setFit(name) { RATIO = FITS[name][0]; TOP = FITS[name][1]; BOTTOM = FITS[name][2]; fit(); }
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var h = Math.min(vw / RATIO, vh / (BOTTOM - TOP));
    var w = h * RATIO, y;
    if (h <= vh) y = (vh - h) / 2;
    else y = -Math.min(Math.max(BOTTOM * h - vh, 0), h - vh);
    stage.style.setProperty('--sw', w + 'px');
    stage.style.setProperty('--sh', h + 'px');
    stage.style.setProperty('--sy', y + 'px');
  }
  fit();
  window.addEventListener('resize', fit);

  function rnd(a, b) { return a + Math.random() * (b - a); }

  // Balloons rise slowly past the pillars; the painted three start where the picture has them.
  var BALLOONS = [
    { src: 'bal_red', x: 1.107, y: 33.744, w: 18.266, h: 10.829, kx: 58.1, dur: 27, sd: 4.4 },
    { src: 'bal_gold', x: 81.734, y: 31.911, w: 16.482, h: 9.407, kx: 28.5, dur: 31, sd: 5.1 },
    { src: 'bal_pur', x: 84.994, y: 39.896, w: 15.006, h: 8.696, kx: 33.5, dur: 25, sd: 3.8 },
    { src: 'bal_pur', x: 3.5, y: 78, w: 12.5, h: 8.696 * 12.5 / 15.006, kx: 33.5, dur: 29, sd: 4.6 },
    { src: 'bal_red', x: 86, y: 70, w: 13, h: 10.829 * 13 / 18.266, kx: 58.1, dur: 33, sd: 4.9 },
    { src: 'bal_gold', x: 5, y: 112, w: 13.5, h: 9.407 * 13.5 / 16.482, kx: 28.5, dur: 30, sd: 4.1 }
  ];
  var balLayer = document.getElementById('balloons');
  BALLOONS.forEach(function (b) {
    var el = document.createElement('div');
    el.className = 'bal';
    el.style.cssText = '--x:' + b.x + '%;--y:' + b.y + '%;--w:' + b.w + '%;--kx:' + b.kx + '%;--sd:' + b.sd + 's';
    el.innerHTML = '<div class="sway"><img src="img/' + b.src + '.webp" alt=""><svg viewBox="0 0 20 100" preserveAspectRatio="none" aria-hidden="true"><path d="M10 0C5 18 15 34 10 52S4 82 11 100"/></svg></div>';
    balLayer.appendChild(el);
    if (reduce || !canAnim) return;
    var start = (104 - b.y) / b.h * 100, end = (-b.h * 1.9 - 4 - b.y) / b.h * 100;
    var a = el.animate([{ transform: 'translate3d(0,' + start + '%,0)' }, { transform: 'translate3d(0,' + end + '%,0)' }],
      { duration: b.dur * 1000, iterations: Infinity, easing: 'linear' });
    a.currentTime = (start / (start - end)) * b.dur * 1000;
  });

  // Show the gift scene only when all of its pictures are ready, so nothing appears half-built.
  function decoded(img) {
    if (img.decode) return img.decode().catch(function () {});
    return new Promise(function (r) { if (img.complete) r(); else { img.onload = img.onerror = r; } });
  }
  Promise.race([
    Promise.all([].map.call(closed.querySelectorAll('img'), decoded)),
    new Promise(function (r) { setTimeout(r, 8000); })
  ]).then(function () { root.classList.add('ready'); sceneShown(); });

  // Sky lanterns drift up out of the opened box.
  var lanLayer = document.getElementById('lanterns');
  var lanAnims = [];
  function lantern(delay, fast) {
    var el = document.createElement('img');
    el.className = 'lan'; el.src = 'img/lantern.webp'; el.alt = '';
    var w = rnd(7, 11.5);
    el.style.cssText = '--x:' + rnd(30, 62) + '%;--w:' + w + '%';
    lanLayer.appendChild(el);
    var dx = rnd(-160, 160), dur = fast ? rnd(5000, 7000) : rnd(11000, 16000);
    var a = el.animate([
      { transform: 'translate3d(0,0,0) scale(.5)', opacity: 0 },
      { transform: 'translate3d(' + dx * .3 + '%,-150%,0) scale(.95)', opacity: 1, offset: .1 },
      { transform: 'translate3d(' + dx + '%,-1150%,0) scale(.6)', opacity: .95, offset: .85 },
      { transform: 'translate3d(' + dx * 1.1 + '%,-1330%,0) scale(.5)', opacity: 0 }
    ], { duration: dur, delay: delay, iterations: fast ? 1 : Infinity, easing: 'linear', fill: 'backwards' });
    if (fast) a.onfinish = function () { el.remove(); };
    else lanAnims.push(a);
  }

  // Confetti in the colours of the painting.
  var COLORS = ['#ff5d8f', '#ffc531', '#e8344a', '#8a5cf6', '#3d7bff', '#fff3a8', '#5fd16b'];
  function tf(x, y, r, s) { return 'translate3d(' + x + 'px,' + y + 'px,0) rotate(' + r + 'deg) scale(' + s + ')'; }
  function confetti(x, y, n, spread) {
    if (reduce || !canAnim) return;
    for (var i = 0; i < n; i++) {
      var el = document.createElement('i');
      el.style.background = COLORS[i % COLORS.length];
      if (i % 3 === 0) { el.style.borderRadius = '50%'; el.style.height = '9px'; }
      fx.appendChild(el);
      var dx = rnd(-spread, spread), up = rnd(180, 420), fall = rnd(380, 760), rot = rnd(-720, 720), s = rnd(.7, 1.25);
      el.animate([
        { transform: tf(x, y, 0, s * .5), opacity: 1, easing: 'cubic-bezier(.15,.75,.35,1)' },
        { transform: tf(x + dx * .6, y - up, rot * .4, s), opacity: 1, offset: .35, easing: 'cubic-bezier(.45,0,.9,.6)' },
        { transform: tf(x + dx, y - up + fall, rot, s), opacity: 0 }
      ], { duration: rnd(1800, 2800), fill: 'forwards' }).onfinish = (function (e) { return function () { e.remove(); }; })(el);
    }
  }
  function boxPoint() {
    var r = stage.getBoundingClientRect();
    return { x: r.left + r.width * .5, y: r.top + r.height * .6 };
  }

  // The opened picture must be ready before the flash ends.
  var openImg = document.getElementById('openBase');
  var ready = (openImg.decode ? openImg.decode() : Promise.resolve()).catch(function () {});

  // Sound: plain <audio> elements (they keep playing with the iPhone silent switch on).
  // 1 = box opening, 2 = reveal, 3 = LET'S GO!, 4 = birthday tune (loops). Levels are baked into the files.
  // The tune starts as soon as the gift appears if the phone allows it; otherwise on the first tap anywhere.
  var sndBtn = document.getElementById('sndBtn');
  var au = null, muted = false, unlocked = false, themeOn = false, themeTimer = 0;
  var gestured = false, introTried = false, afterReveal = false, started = false;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  function audio() {
    if (au) return au;
    au = ['1', '2', '3', '4', '5'].map(function (n) {
      var a = new Audio();
      a.preload = 'auto';
      a.src = 'snd/' + n + '.mp3';
      return a;
    });
    au[3].loop = true;
    au[3].addEventListener('playing', begin);
    au[2].addEventListener('ended', function () { if (themeOn && au[3].paused) resume(au[3]); });
    au[1].addEventListener('ended', themeAfterReveal);
    return au;
  }
  audio();
  function resume(a) {
    a.muted = muted;
    var p = a.play();
    if (p && p.catch) p.catch(function () {});
    return p;
  }
  // A cue that arrives too late (slow network) is dropped, so it never trails the picture.
  function play(i, late) {
    var a = audio()[i];
    a._want = true;
    try { a.currentTime = 0; } catch (e) {}
    a.muted = muted;
    var t0 = Date.now(), p = a.play();
    if (p && p.then) p.then(function () {
      if (late && Date.now() - t0 > late) { a._want = false; a.pause(); }
    }, function () {});
  }
  // Called inside a tap: start every other sound once, silently, so later timed sounds are allowed.
  function unlock() {
    if (unlocked) return;
    unlocked = true;
    audio().forEach(function (a) {
      if (a._want) return;
      a.muted = true;
      var p = a.play();
      var done = function () { if (!a._want) { a.pause(); try { a.currentTime = 0; } catch (e) {} } a.muted = muted; };
      if (p && p.then) p.then(done, done); else done();
    });
  }
  function startTheme(fromTop) {
    themeOn = true;
    au[3]._want = true;
    if (fromTop) { try { au[3].currentTime = 0; } catch (e) {} }
    if (document.hidden) return null;
    return resume(au[3]);
  }
  function stopTheme() {
    themeOn = false;
    au[3]._want = false;
    au[3].pause();
  }
  function themeAfterReveal() {
    if (afterReveal) return;
    afterReveal = true;
    clearTimeout(themeTimer);
    startTheme(true);
  }
  // The first screen waits for one tap (sound needs it); if the phone already plays the tune, skip that step.
  var startBtn = document.getElementById('startBtn');
  function begin() {
    if (started) return;
    started = true;
    root.classList.add('started');
    if (startBtn.parentNode) startBtn.parentNode.removeChild(startBtn);
  }
  startBtn.addEventListener('click', function () {
    gestured = true;
    begin();
    startTheme(false);
    unlock();
    openBtn.focus({ preventScroll: true });
  });
  function sceneShown() {
    if (introTried || busy || document.hidden) return;
    introTried = true;
    var p = startTheme(false);
    var refused = function () { if (!gestured && !started && au[3].paused) stopTheme(); };
    if (p && p.then) p.then(null, refused);
    setTimeout(refused, 1500);
  }
  function setMuted(m) {
    muted = m;
    sndBtn.setAttribute('aria-pressed', m ? 'false' : 'true');
    au.forEach(function (a) { a.muted = m; });
    if (!m && themeOn && au[3].paused) resume(au[3]);
  }
  sndBtn.addEventListener('click', function () {
    gestured = true;
    unlock();
    setMuted(!muted);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { au[3].pause(); return; }
    if (!introTried) sceneShown();
    else if (themeOn && !muted) resume(au[3]);
  });

  var busy = false;
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function openCard() {
    if (busy) return;
    busy = true;
    openBtn.disabled = true;
    gestured = true;
    begin();
    stopTheme();
    play(0, 500);
    unlock();
    if (reduce || !canAnim) { return Promise.all([ready, wheelReady]).then(toWheel); }
    boxIn.style.animation = 'none';
    var origin = '50% 74.2%';
    boxIn.style.transformOrigin = origin;
    boxIn.animate([
      { transform: 'none' }, { transform: 'rotate(-6deg) scale(1.02)' }, { transform: 'rotate(6deg) scale(1.03)' },
      { transform: 'rotate(-5deg) scale(1.03)' }, { transform: 'rotate(4deg) scale(1.04)' }, { transform: 'translateY(-2%) scale(1.06,.97)' }
    ], { duration: 720, easing: 'ease-in-out', fill: 'forwards' });
    wait(640).then(function () {
      gap.animate([{ opacity: 0, transform: 'scaleX(.6)' }, { opacity: 1, transform: 'scaleX(1.1)' }], { duration: 300, fill: 'forwards' });
      lid.animate([
        { transform: 'none' },
        { transform: 'translateY(-9%) rotate(-7deg)' }
      ], { duration: 300, easing: 'cubic-bezier(.2,.9,.3,1.2)', fill: 'forwards' });
      var p = boxPoint(); confetti(p.x, p.y - 40, 26, 170);
      return wait(260);
    }).then(function () {
      flash.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-in', fill: 'forwards' });
      return Promise.all([wait(210), ready, wheelReady]);
    }).then(function () {
      toWheel();
      flash.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 750, easing: 'ease-out', fill: 'forwards' });
      var p = boxPoint(); confetti(p.x, p.y, 60, 230);
    });
  }
  function swap() {
    wheelSec.hidden = true;
    root.classList.remove('is-wheel');
    setFit('gift');
    opened.hidden = false;
    root.classList.add('is-open');
    closed.hidden = true;
    if (!reduce && canAnim) {
      for (var i = 0; i < 6; i++) lantern(400 + i * 2300, false);
    }
    opened.querySelector('h2').focus({ preventScroll: true });
    play(1, 600);
    themeTimer = setTimeout(themeAfterReveal, 2200);
